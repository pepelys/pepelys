name: Update 3D contribution graph

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/profile-3d-contrib.json
      - .github/workflows/profile-3d-contrib.yml

concurrency:
  group: profile-3d-contrib

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib.json
      - name: Commit and push the updated graph
        run: |
          git add -- profile-3d-contrib/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update 3D contribution graph'
          git push origin HEAD
